<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Prep — Saurabh Dhull</title>
  <style>
    :root {
      --bg: #0b1121;
      --surface: #111a2e;
      --surface2: #162044;
      --border: #1e2d50;
      --text: #e2e8f0;
      --text2: #8899b4;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --gold: #facc15;
      --green: #34d399;
      --pink: #e879f9;
      --red: #fb7185;
      --orange: #fb923c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .sidebar .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .sidebar .logo small {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--text2);
      margin-top: 2px;
      letter-spacing: 0;
    }

    .sidebar .search-box {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .sidebar .search-box:focus { border-color: var(--accent); }
    .sidebar .search-box::placeholder { color: var(--text2); }

    .sidebar .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 0.4rem;
    }

    .sidebar .cat-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar .cat-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text2);
      transition: all 0.15s;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
    }
    .sidebar .cat-item:hover { background: rgba(56, 189, 248, 0.08); color: var(--text); }
    .sidebar .cat-item.active { background: rgba(56, 189, 248, 0.15); color: var(--accent); font-weight: 600; }
    .sidebar .cat-item .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .sidebar .cat-item .count {
      margin-left: auto;
      font-size: 0.7rem;
      background: var(--surface2);
      padding: 1px 7px;
      border-radius: 10px;
      color: var(--text2);
    }
    .sidebar .cat-item.active .count { background: rgba(56,189,248,0.2); color: var(--accent); }

    /* ─── MAIN ─── */
    .main {
      flex: 1;
      padding: 2rem 2.5rem;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .stats {
      font-size: 0.85rem;
      color: var(--text2);
      background: var(--surface);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* ─── CATEGORY SECTION ─── */
    .category { margin-bottom: 2.5rem; }
    .category-title {
      font-size: 1.15rem;
      color: var(--gold);
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .category-title .count-badge {
      font-size: 0.7rem;
      background: var(--surface2);
      padding: 0.1rem 0.6rem;
      border-radius: 10px;
      color: var(--text2);
      font-weight: 400;
    }

    /* ─── QUESTION CARD ─── */
    .q-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.5rem;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .q-item:hover { border-color: rgba(56,189,248,0.3); }
    .q-item.open {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56,189,248,0.15);
    }
    .q-item .question {
      padding: 1rem 1.2rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      gap: 1rem;
    }
    .q-item .question .arrow {
      transition: transform 0.25s ease;
      color: var(--text2);
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .q-item.open .question .arrow { transform: rotate(90deg); color: var(--accent); }
    .q-item .answer {
      display: none;
      padding: 0 1.2rem 1.2rem;
      color: var(--text2);
      border-top: 1px solid var(--border);
      line-height: 1.7;
      font-size: 0.9rem;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .q-item.open .answer { display: block; padding-top: 1.2rem; }

    .q-item .answer pre {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.75rem 0;
      color: #a5f3fc;
      font-size: 0.85rem;
      line-height: 1.6;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }
    .q-item .answer .comment { color: var(--green); font-style: italic; }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.12rem 0.5rem;
      border-radius: 10px;
      margin-left: 0.4rem;
      font-weight: 500;
      vertical-align: middle;
    }
    .badge.accenture { background: rgba(124,58,237,0.2); color: #c4b5fd; }
    .badge.popular { background: rgba(225,29,72,0.2); color: #fda4af; }
    .badge.advanced { background: rgba(217,119,6,0.2); color: #fcd34d; }
    .badge.react { background: rgba(56,189,248,0.15); color: #7dd3fc; }
    .badge.node { background: rgba(74,222,128,0.15); color: #86efac; }
    .badge.system-design { background: rgba(232,121,249,0.15); color: #f0abfc; }
    .badge.namaste-js { background: rgba(251,191,36,0.2); color: #fbbf24; }
    .badge.season1 { background: rgba(248,113,113,0.15); color: #fca5a5; }
    .badge.season2 { background: rgba(52,211,153,0.15); color: #6ee7b7; }

    .q-item.empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text2);
    }
    .q-item.empty-state strong { display: block; font-size: 1.1rem; margin-bottom: 0.4rem; color: var(--text); }

    /* ─── SIDEBAR OVERLAY (mobile) ─── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 98;
      backdrop-filter: blur(4px);
    }
    .sidebar-overlay.open { display: block; }

    /* ─── MOBILE HAMBURGER ─── */
    .menu-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.3rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1;
    }
    .menu-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .tag-btn {
      padding: 0.35rem 1rem; border-radius: 20px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text2); font-size: 0.78rem; cursor: pointer; transition: all 0.15s;
    }
    .tag-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tag-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .menu-toggle { display: inline-flex; align-items: center; }
      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 99;
        width: 260px;
        min-width: auto;
        transition: left 0.3s ease;
        display: flex;
        border-right: 1px solid var(--border);
        box-shadow: 4px 0 20px rgba(0,0,0,0.4);
      }
      .sidebar.open { left: 0; }
      .main { padding: 1rem; }
      .header {
        flex-direction: row;
        align-items: center;
        flex-wrap: nowrap;
        gap: 0.5rem;
      }
      .header h1 { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sidebar .search-box { font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      Interview Prep
      <small>Saurabh Dhull — Custom Software Engineer</small>
    </div>

    <div style="text-align:center;padding:0.4rem;background:var(--surface2);border-radius:8px;font-size:0.82rem;color:var(--text2);">
      <span id="stats">0 questions</span>
    </div>

    <input class="search-box" id="search" placeholder="Search questions...">

    <div>
      <div class="section-label">Quick Filters</div>
      <div class="cat-list" id="tagFilters"></div>
    </div>

    <div>
      <div class="section-label">Categories</div>
      <div class="cat-list" id="categoryFilters"></div>
    </div>

    <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text2); text-align: center;">
      <span id="totalStats">0 questions</span>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="header">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">&#9776;</button>
      <h1>JS Interview Prep</h1>
      <button class="tag-btn" id="startQuizBtn" style="font-size:0.82rem;padding:0.4rem 1.2rem;border-radius:8px;background:var(--accent);color:var(--bg);border:none;cursor:pointer;font-weight:600;white-space:nowrap;">&#9654; Start Quiz</button>
    </div>

    <!-- LIST VIEW -->
    <div id="questions-container"></div>

    <!-- QUIZ VIEW (hidden by default) -->
    <div id="quizView" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
        <div style="display:flex;align-items:center;gap:0.6rem;">
          <span id="quizProgress" style="font-size:0.85rem;color:var(--text2);"></span>
          <span id="quizCategory" style="font-size:0.7rem;background:var(--surface2);padding:0.2rem 0.6rem;border-radius:10px;color:var(--gold);"></span>
        </div>
        <button id="exitQuizBtn" class="tag-btn" style="font-size:0.78rem;padding:0.25rem 0.8rem;">&times; Back to List</button>
      </div>

      <div class="q-item open" id="quizCard">
        <div class="question" id="quizQuestion" style="cursor:default;">
          <span id="quizQuestionText"></span>
        </div>
        <div class="answer" id="quizAnswer" style="display:block;"></div>
      </div>

      <div style="display:flex;justify-content:center;gap:1rem;margin-top:1.5rem;">
        <button id="prevBtn" class="tag-btn" style="padding:0.5rem 1.5rem;">&larr; Previous</button>
        <button id="nextBtn" class="tag-btn" style="padding:0.5rem 1.5rem;">Next &rarr;</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
